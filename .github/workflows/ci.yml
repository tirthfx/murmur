name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install, lint and test
        run: |
          if [ -f package.json ]; then
            npm ci && npm run lint --if-present && npm test --if-present
          else
            echo "no package yet"
          fi
