name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  helper-win:
    # The Windows helper (native/helper-win): its unit tests, a cross-build for Windows, and the
    # app's conformance suite run against the real helper process on its fake operating system.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install
        run: npm ci

      - name: Helper unit tests
        run: npm run test:helper:win

      - name: Build the helper for Windows
        run: dotnet publish native/helper-win/src/MurmurHelper -c Release -r win-x64 --self-contained false -o "$RUNNER_TEMP/helper-win"

      - name: Build the helper for the conformance run
        run: npm run build:helper:win

      - name: Conformance suite against the helper
        env:
          MURMUR_REQUIRE_WIN_HELPER: "1"
        run: npx vitest run apps/desktop/src/main/platform

  helper-win-native:
    # The same helper on a real Windows machine: its tests, a native build, and `--self-test`,
    # which runs the Win32 backends (Credential Manager, windows, clipboard, hook, audio list) and
    # transcribes a known recording with the small speech model.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Helper unit tests
        run: dotnet test native/helper-win/tests/MurmurHelper.Core.Tests

      - name: Build the helper
        run: dotnet build native/helper-win/src/MurmurHelper -c Release

      - name: Fetch the small test speech model
        shell: pwsh
        run: |
          $folder = ./native/helper-win/scripts/fetch-test-model.ps1
          "MURMUR_SELFTEST_SPEECH_MODEL=$folder" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Self-test on Windows
        run: native/helper-win/src/MurmurHelper/bin/Release/net9.0-windows/murmur-helper.exe --self-test

  package-win:
    # Packages the app on Windows with the helper inside, makes the installer, installs it silently,
    # and checks the installed helper against its hash file and runs its self-test. The build is
    # not signed and is not kept.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install
        run: npm ci

      - name: Fetch the small test speech model
        shell: pwsh
        run: |
          $folder = ./native/helper-win/scripts/fetch-test-model.ps1
          "MURMUR_SELFTEST_SPEECH_MODEL=$folder" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish the helper
        run: npm run publish:helper:win

      - name: Package the app and make the installer
        run: npm run make

      - name: Check the packaged helper
        shell: pwsh
        run: |
          $dir = Get-ChildItem apps/desktop/out -Directory | Where-Object { $_.Name -like 'Murmur-win32-*' } | Select-Object -First 1
          if (-not $dir) { throw 'the app was not packaged' }
          $helper = Join-Path $dir.FullName 'resources/helper/murmur-helper.exe'
          if (-not (Test-Path $helper)) { throw "the helper is not in the package: $helper" }
          $expected = ((Get-Content "$helper.sha256" -Raw).Trim() -split '\s+')[0].ToLower()
          $actual = (Get-FileHash $helper -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "the helper does not match its hash file ($expected, $actual)" }
          Write-Host "helper hash ok: $actual"
          & $helper --self-test
          if ($LASTEXITCODE -ne 0) { throw 'the packaged helper failed its self-test' }

      - name: Check the packaged cleanup runtime and MCP command
        shell: pwsh
        run: |
          $dir = Get-ChildItem apps/desktop/out -Directory | Where-Object { $_.Name -like 'Murmur-win32-*' } | Select-Object -First 1
          $app = Join-Path $dir.FullName 'Murmur.exe'
          $llama = Join-Path $dir.FullName 'resources/llm-modules/node_modules/node-llama-cpp/dist/index.js'
          if (-not (Test-Path $llama)) { throw "the cleanup runtime is not packaged: $llama" }
          $binary = Get-ChildItem (Join-Path $dir.FullName 'resources/llm-modules/node_modules/@node-llama-cpp/win-x64') -Recurse -Filter '*.node' | Select-Object -First 1
          if (-not $binary) { throw 'the Windows llama binary is not packaged' }
          if (Test-Path (Join-Path $dir.FullName 'resources/llm-modules/node_modules/@node-llama-cpp/win-x64-cuda')) { throw 'a GPU build was packaged' }
          # Load the runtime with the app's own Node, the way the utility process does.
          $check = Join-Path $env:RUNNER_TEMP 'load-llama.mjs'
          Set-Content -Path $check -Value @'
          import { pathToFileURL } from "node:url";
          const llama = await import(pathToFileURL(process.argv[2]).href);
          const runtime = await llama.getLlama({ build: "never", gpu: false, logLevel: "error" });
          console.log("llama loaded, gpu=" + runtime.gpu);
          '@
          $env:ELECTRON_RUN_AS_NODE = '1'
          # The app is a GUI program, so reading its output is what makes this wait for it.
          $loaded = & $app $check $llama 2>&1 | Out-String
          Write-Host $loaded
          if ($loaded -notmatch 'llama loaded') { throw 'the packaged cleanup runtime did not load' }
          # The MCP command: no token, then a token with nothing listening.
          $cmd = Join-Path $dir.FullName 'resources/mcp/murmur-mcp.cmd'
          if (-not (Test-Path $cmd)) { throw 'the MCP command is not packaged' }
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          Remove-Item Env:MURMUR_MCP_TOKEN -ErrorAction SilentlyContinue
          $out = & $cmd '\\.\pipe\murmur-mcp-ci-none' 2>&1 | Out-String
          if ($LASTEXITCODE -ne 1 -or $out -notmatch 'MURMUR_MCP_TOKEN is not set') { throw "unexpected: $LASTEXITCODE $out" }
          $env:MURMUR_MCP_TOKEN = 'tok'
          $out = & $cmd '\\.\pipe\murmur-mcp-ci-none' 2>&1 | Out-String
          if ($LASTEXITCODE -ne 1 -or $out -notmatch 'Murmur is not running') { throw "unexpected: $LASTEXITCODE $out" }
          Write-Host 'cleanup runtime loads and the MCP command answers'
          # The last command above failed on purpose; do not let its code be the step's.
          exit 0

      - name: The MCP command over a named pipe
        working-directory: apps/desktop
        run: npx vitest run src/main/mcp/shim-js.test.ts

      - name: Install it and check the installed helper
        shell: pwsh
        run: |
          $setup = Get-ChildItem apps/desktop/out/make -Recurse -Filter 'Murmur-Setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'the installer was not made' }
          Start-Process -FilePath $setup.FullName -ArgumentList '--silent' -Wait
          $root = Join-Path $env:LOCALAPPDATA 'Murmur'
          $app = $null
          for ($i = 0; $i -lt 30 -and -not $app; $i++) {
            $app = Get-ChildItem $root -Directory -Filter 'app-*' -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $app) { Start-Sleep -Seconds 2 }
          }
          if (-not $app) { throw "nothing was installed under $root" }
          $helper = Join-Path $app.FullName 'resources/helper/murmur-helper.exe'
          if (-not (Test-Path $helper)) { throw "the installed app has no helper: $helper" }
          $expected = ((Get-Content "$helper.sha256" -Raw).Trim() -split '\s+')[0].ToLower()
          $actual = (Get-FileHash $helper -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw 'the installed helper does not match its hash file' }
          Write-Host "installed at $($app.FullName), helper hash ok"
          & $helper --self-test
          if ($LASTEXITCODE -ne 0) { throw 'the installed helper failed its self-test' }
          Get-Process Murmur -ErrorAction SilentlyContinue | Stop-Process -Force
